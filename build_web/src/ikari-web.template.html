<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A live WebGPU demo of the ikari game engine.">
    <title>{{name}}</title>
    {{coiscript}}
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #eee;
            background: #111;
            font-family: sans-serif;
        }

        .splash {
            position: absolute;
            z-index: 1;
            max-width: 34rem;
            padding: 2rem;
            line-height: 1.5;
        }

        .controls {
            color: #aaa;
        }

        #start_game {
            padding: 0.6rem 1rem;
            color: #111;
            font: inherit;
            background: #eee;
            border: 1px solid #eee;
            border-radius: 3px;
            cursor: pointer;
        }

        a {
            color: inherit;
        }

        .fatalerror {
            padding: 1rem;
            color: #f88;
        }

        #canvas_container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <main id="start_screen" class="splash">
        <p>
            This is the demo for <a href="https://github.com/Davidster/ikari" target="_blank"
                rel="noreferrer">ikari</a>, a Rust game engine. It runs in the browser using WebGPU.
        </p>
        <p class="controls">
            Mouse to look, WASD to move, Space and Control to move vertically, and Tab for options.
        </p>
        <button id="start_game" type="button">Start demo</button>
    </main>
    <div id="canvas_container"></div>

    <script type="module">
        import init from "{{jspath}}";

        window.addEventListener("load", () => {
            const startScreen = document.getElementById("start_screen");
            const startButton = document.getElementById("start_game");

            if (!window.crossOriginIsolated) {
                startButton.disabled = true;
                startButton.textContent = "Preparing demo…";
                return;
            }

            startButton.addEventListener("click", () => {
                startScreen.remove();

                (async () => {
                    try {
                        await init();
                    } catch (err) {
                        console.error(err);
                        const errorMessage = document.createElement("div");
                        errorMessage.className = "fatalerror";
                        errorMessage.textContent = "The demo could not start: " + err;
                        document.body.appendChild(errorMessage);
                    }
                })();
            });
        });
    </script>
</body>

</html>
